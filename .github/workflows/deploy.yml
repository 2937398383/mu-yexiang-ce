# 部署：push main 时先跑测试，通过后部署 Worker 与 Pages
# 首次使用前需在 GitHub 仓库 Settings → Secrets and variables → Actions 配置：
#   CLOUDFLARE_API_TOKEN   — 权限：Workers Scripts:Edit + Pages:Edit + D1:Edit + R2 不需要（绑定性操作）
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare 账户 ID
# 未配置 Secret 时本工作流自动跳过（不会红叉）。
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install worker dependencies
        working-directory: worker
        run: npm ci
      - name: Unit tests
        working-directory: worker
        run: npm test

  deploy-worker:
    needs: test
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install worker dependencies
        working-directory: worker
        run: npm ci
      - name: Deploy Worker
        working-directory: worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-pages:
    needs: deploy-worker
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install worker dependencies
        working-directory: worker
        run: npm ci
      - name: Deploy Pages
        working-directory: worker
        run: npx wrangler pages deploy ../web --project-name album-web --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
