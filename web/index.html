<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f8a4d">
  <title>牧野云相册</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <link rel="dns-prefetch" href="https://album-photos.65e1870ebd61513b5e09664b1673a5ed.r2.cloudflarestorage.com">
  <link rel="preconnect" href="https://album-photos.65e1870ebd61513b5e09664b1673a5ed.r2.cloudflarestorage.com">
  <!-- @imgly/background-removal 内部动态 import 裸包名，需用 importmap 指向自托管副本 -->
  <script type="importmap">
  {
    "imports": {
      "onnxruntime-web": "/vendor/ort/ort.bundle.min.mjs",
      "onnxruntime-web/webgpu": "/vendor/ort/ort.bundle.min.mjs"
    }
  }
  </script>
  <!-- Cloudflare Turnstile（人机验证）：render=explicit 手动渲染，弹窗打开时才显示 -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/albums">牧野云相册</a>
    <div class="topbar-right">
      <button class="btn small ghost" id="theme-btn" type="button">深色</button>
      <div id="auth-area"></div>
    </div>
  </header>

  <main id="view"></main>

  <!-- 模态框与提示挂载点 -->
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="config.js" defer></script>
  <script src="crypto-core.js" defer></script>
  <script src="vendor/exifr/lite.umd.js" defer></script>
  <script src="vendor/browser-image-compression.js" defer></script>
  <script src="vendor/jszip.min.js" defer></script>
  <script src="vendor/thumbhash/thumbhash.js" defer></script>
  <script src="upload-util.js" defer></script>
  <script src="idphoto.js" defer></script>
  <script src="style-transfer.js" defer></script>
  <script src="bg-replace.js" defer></script>
  <script type="module" src="app.js"></script>
  <script>
    // PWA：注册 Service Worker（排除 localhost 与 Pages 预览子域，避免调试/验证时缓存干扰）
    (function () {
      if (!('serviceWorker' in navigator)) return;
      const h = location.hostname;
      const isPreview = h.endsWith('.album-web.pages.dev') && h !== 'album-web.pages.dev';
      if (h.includes('localhost') || isPreview) return;
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    })();
  </script>
</body>
</html>
